title: coverage-report
author: Harness
tags:
  - coverage report
  - publish
logo:
repo: https://github.com/harness-community/drone-coverage-report/
image: https://hub.docker.com/r/plugins/emailcoverage-report
license: Apache License 2.0
readme: https://github.com/harness-community/drone-coverage-report/blob/main/README.md
description: A plugin to extract metrics from coverage reports generated by different coverage tools.
example: |
  kind: pipeline
  name: default

  steps:
  - name: drone-coverage-report
    image: harness-community/drone-coverage-report
    type: Plugin
    identifier: custom_plugin
    settings:
      tool: jacoco
      reports_path_pattern: '**/target/jacoco.exec'
      fail_on_threshold: 'true'
      fail_if_no_reports: 'false'
      class_directories: '**/target/classes, **/WEB-INF/classes'
      class_inclusion_pattern: '**/*.class, **/*.xml'
      class_exclusion_pattern: '**/controllers/*.class'
      source_directories: '**/src/main/java'
      source_inclusion_pattern: '**/*.java, *.groovy'
      source_exclusion_pattern: '**/controllers/*.java'
      skip_source_copy: 'false'
      threshold_instruction: '0'
      threshold_branch: '0'
      threshold_complexity: '80'
      threshold_line: '0'
      threshold_method: '0'
      threshold_class: '0'
      threshold_package: '100'
      threshold_file: '50.0'
      threshold_loc: '15'
      drone_workspace: '/harness'
      drone_output: '/tmp/drone-output'

properties:
  reports_path_pattern:
    type: string
    defaultValue: "**/reports/jacoco.xml"
    description: Glob pattern to locate code coverage report files (e.g., JaCoCo XML reports).
    secret: false
    required: false
  fail_on_threshold:
    type: boolean
    defaultValue: false
    description: Whether to fail the build if any coverage threshold is not met.
    secret: false
    required: false
  fail_if_no_reports:
    type: boolean
    defaultValue: true
    description: Whether to fail the build if no coverage reports are found matching the pattern.
    secret: false
    required: false
  class_directories:
    type: array
    defaultValue: []
    description: List of directories containing compiled `.class` files to analyze.
    secret: false
    required: false
  class_inclusion_pattern:
    type: string
    defaultValue: "**/*.class"
    description: Glob pattern for including specific class files during coverage analysis.
    secret: false
    required: false
  class_exclusion_pattern:
    type: string
    defaultValue: ""
    description: Glob pattern for excluding specific class files from coverage analysis.
    secret: false
    required: false
  source_directories:
    type: array
    defaultValue: []
    description: List of directories containing source code used for correlating coverage results.
    secret: false
    required: false
  source_inclusion_pattern:
    type: string
    defaultValue: "**/*.java"
    description: Glob pattern for including specific source files during coverage analysis.
    secret: false
    required: false
  source_exclusion_pattern:
    type: string
    defaultValue: ""
    description: Glob pattern for excluding specific source files from analysis.
    secret: false
    required: false
  skip_source_copy:
    type: boolean
    defaultValue: false
    description: Skip copying source files into the workspace, useful for large projects or read-only sources.
    secret: false
    required: false
  threshold_instruction:
    type: number
    defaultValue: 0
    description: Minimum required instruction coverage percentage (executed bytecode instructions).
    secret: false
    required: false
  threshold_branch:
    type: number
    defaultValue: 0
    description: Minimum required branch coverage percentage (branches in conditional statements).
    secret: false
    required: false
  threshold_complexity:
    type: number
    defaultValue: 0
    description: Minimum required Cyclomatic Complexity coverage percentage.
    secret: false
    required: false
  threshold_complexity_density:
    type: number
    defaultValue: 0
    description: Minimum average complexity per line of code (complexity density).
    secret: false
    required: false
  threshold_line:
    type: number
    defaultValue: 0
    description: Minimum required line coverage percentage (lines of code executed).
    secret: false
    required: false
  threshold_method:
    type: number
    defaultValue: 0
    description: Minimum required method coverage percentage.
    secret: false
    required: false
  threshold_class:
    type: number
    defaultValue: 0
    description: Minimum required class coverage percentage.
    secret: false
    required: false
  threshold_package:
    type: number
    defaultValue: 0
    description: Minimum required package coverage percentage.
    secret: false
    required: false
  threshold_file:
    type: number
    defaultValue: 0
    description: Minimum required file coverage percentage.
    secret: false
    required: false
  threshold_loc:
    type: number
    defaultValue: 0
    description: Minimum acceptable total lines of code (LOC) to consider for coverage validation.
    secret: false
    required: false
  drone_workspace:
    type: string
    defaultValue: "/drone/src"
    description: Root working directory of the Drone CI workspace.
    secret: false
    required: false
  drone_output:
    type: string
    defaultValue: "/drone/output"
    description: Output directory where reports or artifacts should be written.
    secret: false
    required: false
