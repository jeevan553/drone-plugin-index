title: Slack
author: drone-plugins
tags:
  - notifications
  - chat
logo: slack.svg
repo: https://github.com/drone-plugins/drone-slack
image: https://hub.docker.com/r/plugins/slack
license: Apache License 2.0
readme: https://github.com/drone-plugins/drone-slack/blob/master/README.md
description: The Slack plugin posts build status messages to your channel.
example: |
  kind: pipeline
  name: default

  steps:
  - name: slack
    image: plugins/slack
    settings:
      webhook: https://hooks.slack.com/services/...
      channel: dev
      icon_url: https://unsplash.it/256/256/?random
properties:
  webhook:
    type: string
    defaultValue: false
    description: incoming webhook url for posting to a channel
    secret: false
    required: true
  channel:
    type: string
    defaultValue: false
    description: messages sent to the above webhook are posted here
    secret: false
    required: false
  recipient:
    type: string
    defaultValue: false
    description: alternatively you can send it to a specific user
    secret: false
    required: false
  username:
    type: string
    defaultValue: false
    description: choose the username this integration will post as
    secret: false
    required: false
  template:
    type: string
    defaultValue: false
    description: overwrite the default message template
    secret: false
    required: false
  image_url:
    type: string
    defaultValue: false
    description: a valid URL to an image file that will be displayed inside a message attachment
    secret: false
    required: false
  icon_url:
    type: string
    defaultValue: false
    description: a valid URL that displays a image to the left of the username
    secret: false
    required: false
  icon_emoji:
    type: string
    defaultValue: false
    description: displays a emoji to the left of the username
    secret: false
    required: false
  link_names:
    type: string
    defaultValue: false
    description: links usernames and channels in the message
    secret: false
    required: false
  drone_repo_owner:
    type: string
    defaultValue: ""
    description: Owner of the repository.
    secret: false
    required: false
  drone_repo_name:
    type: string
    defaultValue: ""
    description: Repository name.
    secret: false
    required: false
  drone_commit_sha:
    type: string
    defaultValue: ""
    description: SHA of the commit.
    secret: false
    required: false
  drone_commit_branch:
    type: string
    defaultValue: ""
    description: The branch of the commit.
    secret: false
    required: false
  drone_commit_author:
    type: string
    defaultValue: ""
    description: Author of the commit.
    secret: false
    required: false
  drone_commit_author_email:
    type: string
    defaultValue: ""
    description: Email of the commit author.
    secret: false
    required: false
  drone_commit_author_avatar:
    type: string
    defaultValue: ""
    description: Avatar URL of the commit author.
    secret: false
    required: false
  drone_commit_author_name:
    type: string
    defaultValue: ""
    description: Name of the commit author.
    secret: false
    required: false
  drone_build_number:
    type: string
    defaultValue: ""
    description: Build number.
    secret: false
    required: false
  drone_build_status:
    type: string
    defaultValue: ""
    description: Status of the build.
    secret: false
    required: false
  drone_build_link:
    type: string
    defaultValue: ""
    description: Link to the build.
    secret: false
    required: false
  drone_tag:
    type: string
    defaultValue: ""
    description: Git tag reference.
    secret: false
    required: false
  plugin_access_token:
    type: string
    defaultValue: ""
    description: Access token for authentication.
    secret: true
    required: true
  plugin_file_path:
    type: string
    defaultValue: ""
    description: Path to the file.
    secret: false
    required: false
  plugin_initial_comment:
    type: string
    defaultValue: ""
    description: Initial comment for the plugin.
    secret: false
    required: false
  plugin_title:
    type: string
    defaultValue: ""
    description: Title for the plugin output.
    secret: false
    required: false
  plugin_slack_id_of:
    type: string
    defaultValue: ""
    description: Slack ID to send messages to.
    secret: false
    required: false
  plugin_recent_commit_id:
    type: string
    defaultValue: ""
    description: Recent commit ID for tracking.
    secret: false
    required: false
  plugin_old_commit_id:
    type: string
    defaultValue: ""
    description: Old commit ID for comparison.
    secret: false
    required: false
