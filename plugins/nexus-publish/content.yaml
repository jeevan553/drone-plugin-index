title: Nexus Publish
author: harness
tags:
  - sonatype_nexus
  - nexus_publish
  - upload_artifacts
  - artifact
logo: sonatype_nexus.png
repo: https://github.com/harness-community/drone-nexus-publish
image: https://hub.docker.com/r/harnesscommunity/drone-nexus-publish/
license: Apache 2.0 License
readme: https://github.com/harness-community/drone-nexus-publish/blob/main/README.md
description: Drone plugin to publish artifacts to Nexus Repository Manager.
example: |
  kind: pipeline
  name: default
  steps:
  - steps:
    name: sam_build
    image: harnesscommunity/drone-nexus-publish
    settings:
      username: deploy-user
      password: testing-nexus
      server_url: http://nexus-publish.server
      filename: ./target/example.jar
      format: maven2
      repository: maven-releases
      attributes: "-CgroupId=org.testing -CartifactId=example -Cversion=1.0 -Aextension=jar -Aclassifier=bin"
      group_id: test01
      protocol: http
      nexus_version: nexus3
      artifacts:
        - file: file1.yaml
          classifier: bin
          groupId: test
          artifactId: config-yaml-1
          type: yaml
          version: "1"
        - file: file2.yaml
          classifier: src
          groupId: test
          artifactId: all-config-yaml-2
          type: yaml
          version: "2"
properties:
  username:
    type: string
    defaultValue: none
    description: A username for accessing Nexus Repository Manager.
    secret: false
    required: false
  password:
    type: string
    defaultValue: none
    description: An expression referencing a secret containing the password for the specified username.
    secret: true
    required: false
  server_url:
    type: string
    defaultValue: none
    description: The URL of your Nexus Repository Manager instance.
    secret: false
    required: false
  filename:
    type: string
    defaultValue: none
    description: The path to the target artifact that you want to upload.
    secret: false
    required: false
  format:
    type: string
    defaultValue: none
    description: The repository format.
    secret: false
    required: false
  repository:
    type: string
    defaultValue: none
    description: The name of the repository where you want to upload the artifact.
    secret: false
    required: false
  attributes:
    type: string
    defaultValue: none
    description: Component and asset attributes providing additional artifact metadata. "-CgroupId=org.dronetest -CartifactId=example -Cversion=1.0 -Aextension=jar -Aclassifier=bin"
    secret: false
    required: false
  plugin_nexus_version:
    type: string
    defaultValue: "3"
    description: "Version of Nexus Repository Manager to target (e.g., 2 or 3)."
    secret: false
    required: false
  plugin_group_id:
    type: string
    defaultValue: ""
    description: "Group ID to associate with the artifact (e.g., com.example.project)."
    secret: false
    required: false
  plugin_protocol:
    type: string
    defaultValue: "http"
    description: "Protocol to use for communicating with Nexus (http or https)."
    secret: false
    required: false
  plugin_artifacts:
    type: array
    defaultValue: []
    description: "List of artifact files to upload. Each entry can include artifact-specific metadata like classifier and extension."
    secret: false
    required: false